name: Container image

# Builds the same Docker image Render builds, for the Azure copy, and publishes it to GitHub's container
# registry. It runs only after CI has passed on main, so the VM never gets untested code; the VM itself
# never builds anything (a build needs more memory than it can spare). Render is unaffected: it keeps
# building from the repository as before.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          labels: org.opencontainers.image.source=https://github.com/RishabhPR77/code-archaeology-rag
          tags: |
            ghcr.io/rishabhpr77/code-archaeology-rag:latest
            ghcr.io/rishabhpr77/code-archaeology-rag:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
