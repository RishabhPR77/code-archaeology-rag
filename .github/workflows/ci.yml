name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # requirements.txt only: the tests fake the embedding model, so torch isn't needed
      - run: pip install -r requirements.txt pytest==9.1.1 ruff==0.14.4 pip-audit==2.10.0
      # Rules in backend/ruff.toml
      - run: ruff check .
      - run: python -m pytest -q
      # Known vulnerabilities in the pinned packages (the PyPI advisory database)
      - run: pip-audit -r requirements.txt

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Known vulnerabilities in what ships to the browser
      - run: npm audit --omit=dev --audit-level=high
