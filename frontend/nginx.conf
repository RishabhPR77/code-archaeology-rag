server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same-origin API: the session cookie stays first-party
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # long LLM answers
        client_max_body_size 1m;
    }

    # `expires` instead of add_header: a location-level add_header would drop the security headers above
    # Hashed build assets never change
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA routing; index.html is always revalidated so deploys show up immediately
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
